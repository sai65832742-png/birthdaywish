<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Stutu</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Cormorant+Garamond:ital,wght@1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff4ee;--ink:#7a1745;--gold:#f5b942;--serif:"Cormorant Garamond",Georgia,serif;--disp:"Abril Fatface","Bodoni 72",Didot,Georgia,serif;--script:"Great Vibes","Brush Script MT",cursive;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--cream);overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s,visibility .9s}
.scene.on{opacity:1;visibility:visible}
canvas{position:absolute;inset:0}
/* scene 1 */
#s1{background:radial-gradient(ellipse at 50% 30%,#fff 0,#fff6f1 40%,#fde9e2 100%)}
#glow{position:absolute;left:50%;top:30%;width:min(70vw,440px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,rgba(255,90,150,.4),rgba(255,120,160,.14) 50%,transparent 70%);animation:breathe 3.2s ease-in-out infinite;transition:opacity .4s}
@keyframes breathe{50%{scale:1.12;opacity:.8}}
#heart{position:absolute;left:50%;top:30%;width:clamp(70px,13vw,104px);translate:-50% -50%;filter:drop-shadow(0 8px 14px rgba(220,30,110,.35));animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{scale:1.07}}
#heart.hit{animation:hit .35s ease}
@keyframes hit{25%{rotate:-8deg;scale:1.18}60%{rotate:6deg}}
#c1{z-index:2;touch-action:none;cursor:grab}
.cap{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 12%);translate:-50% 0;margin:0;white-space:nowrap;font:italic 500 clamp(14px,2vw,18px) var(--serif);color:var(--ink)}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8%);translate:-50% 0;margin:0;white-space:nowrap;font:italic 500 12px var(--serif);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);opacity:.8;pointer-events:none;z-index:3}
#disc{position:absolute;left:50%;top:30%;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff4f95,#d4156b);transform:translate(-50%,-50%) scale(0);z-index:5;pointer-events:none}
/* scene 2 */
#s2{background:radial-gradient(ellipse at 8% 6%,#f06aa5 0,transparent 42%),radial-gradient(ellipse at 92% 100%,#9c0a4c,transparent 55%),#c8105e}
.bar{position:absolute;left:0;right:0;height:13%;background:#12000a}
.bar.t{top:0}.bar.b{bottom:0}
.c2{position:absolute;inset:13% 5%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff4ee}
.wish,.sub{margin:0;font:italic 500 clamp(14px,2vw,19px) var(--serif);opacity:0}
.on .wish{animation:fade .8s .1s forwards}
.on .sub{animation:fade .9s 1.7s forwards}
h1{margin:.1em 0 .12em;font:400 min(16vw,19vh,170px)/.94 var(--disp);letter-spacing:-.01em}
.w{display:block;overflow:hidden;padding-bottom:.06em}
.w b{display:block;font-weight:400;transform:translateY(110%)}
.on .w b{animation:up .9s cubic-bezier(.2,.8,.2,1) .4s forwards}
.on .w:nth-child(2) b{animation-delay:.7s}
@keyframes up{to{transform:none}}
@keyframes fade{to{opacity:1}}
.sq{width:min(60vw,320px);height:auto;fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:330;stroke-dashoffset:330;margin-bottom:.8em}
.on .sq{animation:draw 1.1s 1.3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* scene 3 */
#s3{background:radial-gradient(circle at 66% 62%,#fffde6 0,rgba(255,244,200,.85) 22%,transparent 55%),radial-gradient(circle at 18% 18%,rgba(255,255,255,.7),transparent 32%),linear-gradient(160deg,#ffe6d2,#fdd3d8 70%,#fcc9d6)}
.band{position:absolute;left:0;bottom:calc(env(safe-area-inset-bottom,0px) + 6%);width:min(100%,640px);padding:14px 6vw 16px;background:linear-gradient(90deg,rgba(255,255,255,.62),rgba(255,255,255,.4) 70%,transparent)}
.band p{margin:0;opacity:0}
.band .s{font:italic 500 clamp(13px,1.8vw,16px) var(--serif);color:var(--ink)}
.band .sc{font:400 clamp(36px,7vw,66px)/1.15 var(--script);color:#c4105f;text-shadow:0 2px 6px rgba(196,16,95,.25)}
.on .band .s{animation:fade .9s 1.2s forwards}
.on .band .sc{animation:fade 1.1s 2.2s forwards}
.on .band .s2{animation:fade .9s 3.6s forwards}
#again{position:absolute;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:none;border:0;padding:8px;font:italic 500 14px var(--serif);color:var(--ink);opacity:.6;cursor:pointer}
#again:hover,#again:focus-visible{opacity:1;outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#heart,#glow{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <section class="scene on" id="s1">
    <div id="glow"></div>
    <svg id="heart" viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ac8"/><stop offset=".5" stop-color="#ff3e8e"/><stop offset="1" stop-color="#d81b6f"/></linearGradient></defs>
      <path d="M50 92C8 64 0 36 17 19 31 6 46 13 50 28 54 13 69 6 83 19 100 36 92 64 50 92Z" fill="url(#hg)"/>
      <ellipse cx="31" cy="27" rx="10" ry="5.5" fill="#fff" opacity=".8" transform="rotate(-25 31 27)"/>
    </svg>
    <p class="cap">a little something, for you</p>
    <canvas id="c1" aria-label="Pull back the bow and release to shoot the heart"></canvas>
    <p id="hint">pull &amp; release</p>
    <div id="disc"></div>
  </section>

  <section class="scene" id="s2">
    <i class="bar t"></i><i class="bar b"></i>
    <div class="c2">
      <p class="wish">make a wish…</p>
      <h1><span class="w"><b>Happy</b></span><span class="w"><b>Birthday</b></span></h1>
      <svg class="sq" viewBox="0 0 300 20" aria-hidden="true"><path d="M4 12C60 4 120 16 180 8S260 6 296 11"/></svg>
      <p class="sub"><span data-name></span>, you’re someone worth celebrating</p>
    </div>
  </section>

  <section class="scene" id="s3">
    <canvas id="c3"></canvas>
    <div class="band">
      <p class="s">and… make it count</p>
      <p class="sc">Happy Birthday, <span data-name></span></p>
      <p class="s s2">here’s to a year that blooms</p>
    </div>
    <button id="again" type="button">replay</button>
  </section>
</div>

<script>
const NAME='Stutu'; // change the name here
const $=s=>document.querySelector(s),T=Math.PI*2;
document.querySelectorAll('[data-name]').forEach(e=>e.textContent=NAME);
const DPR=Math.min(window.devicePixelRatio||1,2);
const c1=$('#c1'),c3=$('#c3'),g1=c1.getContext('2d'),g3=c3.getContext('2d');
let W,H,scene=1,bow,target,pull=null,arrow=null,parts=[],misses=0,state='aim';
let segs=[],hearts=[],fall=[],amb=[],t3=0,lastSpawn=0;

function fit(c,g){c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';g.setTransform(DPR,0,0,DPR,0,0)}
function layout(){
  W=innerWidth;H=innerHeight;fit(c1,g1);fit(c3,g3);
  bow={x:W*(W<600?.22:.25),y:H*.76};
  target={x:W/2,y:H*.3,r:Math.min(Math.max(W*.065,35),52)};
  if(scene===3)buildTree();
}
function show(n){scene=n;document.querySelectorAll('.scene').forEach((e,i)=>e.classList.toggle('on',i+1===n))}

/* ---------- scene 1: bow & arrow ---------- */
function drawBow(n){
  const{x,y}=bow;g1.lineCap='round';g1.lineJoin='round';
  g1.strokeStyle='#6a3a2c';g1.lineWidth=4;g1.beginPath();g1.moveTo(x+6,y-36);g1.quadraticCurveTo(x-24,y,x+6,y+36);g1.stroke();
  g1.strokeStyle='#8c6254';g1.lineWidth=1.4;g1.beginPath();g1.moveTo(x+6,y-36);g1.lineTo(n.x,n.y);g1.lineTo(x+6,y+36);g1.stroke();
}
function drawArrow(x,y,a){
  g1.save();g1.translate(x,y);g1.rotate(a);g1.lineCap='round';
  g1.strokeStyle='#7a4a3a';g1.lineWidth=2.4;g1.beginPath();g1.moveTo(0,0);g1.lineTo(58,0);g1.stroke();
  g1.fillStyle='#f5b942';g1.beginPath();g1.moveTo(68,0);g1.lineTo(57,-4.5);g1.lineTo(57,4.5);g1.fill();
  g1.strokeStyle='#e8337f';g1.lineWidth=3;g1.beginPath();
  g1.moveTo(3,0);g1.lineTo(-5,-5.5);g1.moveTo(3,0);g1.lineTo(-5,5.5);g1.moveTo(10,0);g1.lineTo(2,-5.5);g1.moveTo(10,0);g1.lineTo(2,5.5);g1.stroke();
  g1.restore();
}
function mv(e){
  if(!pull)return;
  let dx=e.clientX-bow.x,dy=e.clientY-bow.y,l=Math.hypot(dx,dy);
  if(l>100){dx*=100/l;dy*=100/l;l=100}
  pull={x:bow.x+dx,y:bow.y+dy,len:l};
}
c1.addEventListener('pointerdown',e=>{
  if(state!=='aim')return;
  if(Math.hypot(e.clientX-bow.x,e.clientY-bow.y)<150){pull={x:bow.x,y:bow.y,len:0};c1.setPointerCapture(e.pointerId);mv(e)}
});
c1.addEventListener('pointermove',mv);
c1.addEventListener('pointerup',()=>{if(!pull)return;const p=pull;pull=null;if(p.len>=22)shoot(p)});
c1.addEventListener('pointercancel',()=>{pull=null});

function shoot(p){
  let a=Math.atan2(bow.y-p.y,bow.x-p.x);
  const want=Math.atan2(target.y-bow.y,target.x-bow.x);
  let d=want-a;d=Math.atan2(Math.sin(d),Math.cos(d));
  const k=(misses>1||Math.abs(d)>1.5)?1:.55; // gentle aim assist
  a+=d*k;
  const sp=10+p.len*.1;
  arrow={x:bow.x,y:bow.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,a};
  state='fly';$('#hint').style.opacity=.45;
}
function hit(){
  state='hit';
  const cols=['#f5b942','#ff4f95','#ffd76a','#e8337f'];
  for(let i=0;i<36;i++){const a=Math.random()*T,s=2+Math.random()*4;parts.push({x:target.x,y:target.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,r:1.5+Math.random()*2.5,c:cols[i%4]})}
  $('#heart').classList.add('hit');
  const d=$('#disc');
  setTimeout(()=>{$('#heart').style.visibility='hidden';$('#glow').style.opacity=0;d.style.transition='transform .35s cubic-bezier(.3,1.6,.5,1)';d.style.transform='translate(-50%,-50%) scale(1.7)'},450);
  setTimeout(()=>{d.style.transition='transform 1s cubic-bezier(.7,0,.3,1)';d.style.transform='translate(-50%,-50%) scale(50)'},1000);
  setTimeout(()=>show(2),1700);
  setTimeout(startTree,1700+5800);
}
function resetAll(){
  state='aim';misses=0;arrow=null;parts=[];pull=null;
  const h=$('#heart');h.style.visibility='';h.classList.remove('hit');
  $('#glow').style.opacity='';
  const d=$('#disc');d.style.transition='none';d.style.transform='translate(-50%,-50%) scale(0)';
  const t=$('#hint');t.textContent='pull & release';t.style.opacity=.8;
  show(1);
}

/* ---------- scene 3: heart tree ---------- */
function mkSpr(a,b){
  const c=document.createElement('canvas');c.width=c.height=48;const g=c.getContext('2d');
  const gr=g.createLinearGradient(8,6,40,42);gr.addColorStop(0,a);gr.addColorStop(1,b);
  g.fillStyle=gr;g.beginPath();g.moveTo(24,42);g.bezierCurveTo(2,28,0,14,10,8);g.bezierCurveTo(17,4,22,8,24,14);g.bezierCurveTo(26,8,31,4,38,8);g.bezierCurveTo(48,14,46,28,24,42);g.fill();
  g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(14,14,4,2.4,-.6,0,T);g.fill();
  return c;
}
const spr=[['#ff8fc0','#e8337f'],['#ffb0d0','#ff4f95'],['#ffb347','#ff8a3d'],['#ffe08a','#f5a623'],['#ff6fae','#c4105f']].map(p=>mkSpr(p[0],p[1]));
const pick=()=>{const r=Math.random();return r<.38?0:r<.62?1:r<.82?2:r<.93?3:4};

function buildTree(){
  const mob=W<700,cx=mob?W*.5:W*.64,R=Math.min(W*(mob?.4:.3),H*(mob?.24:.27)),cy=H*(mob?.3:.36),top=cy+R*.72,lw=Math.max(8,R*.06);
  segs=[{x:cx,y:H+10,x2:cx,y2:top,w:lw,a:0,b:.16}];
  (function br(x,y,ang,len,w,d,t0){
    const x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;
    segs.push({x,y,x2,y2,w,a:t0,b:t0+.13});
    if(d>0)for(const s of[-1,1])br(x2,y2,ang+s*(.4+Math.random()*.3),len*.8,w*.68,d-1,t0+.11);
  })(cx,top,-Math.PI/2,R*.55,lw*.8,4,.16);
  hearts=[];const N=mob?250:340;
  while(hearts.length<N){
    const u=Math.random()*2.5-1.25,v=Math.random()*2.3-1.05;
    if(Math.pow(u*u+v*v-1,3)-u*u*v*v*v<0)hearts.push({x:cx+u*R,y:cy-v*R,s:R*(.11+Math.random()*.09),r:(Math.random()-.5)*.8,c:pick(),t:.42+.5*((v+1.05)/2.3)+Math.random()*.06,ph:Math.random()*T});
  }
  if(!amb.length)for(let i=0;i<16;i++)amb.push({x:Math.random(),y:Math.random(),s:6+Math.random()*8,vy:.12+Math.random()*.25,ph:Math.random()*T});
}
function startTree(){t3=performance.now();fall=[];lastSpawn=0;scene=3;buildTree();show(3)}

function drawTree(t){
  const g=g3;g.clearRect(0,0,W,H);
  const p=Math.min((t-t3)/4800,1);
  // ambient tiny hearts
  g.globalAlpha=.45;
  for(const a of amb){a.y+=a.vy/H*4;if(a.y>1.05)a.y=-.05;const x=a.x*W+Math.sin(t*.0007+a.ph)*14,y=a.y*H;g.drawImage(spr[1],x,y,a.s,a.s)}
  g.globalAlpha=1;
  // branches
  g.lineCap='round';g.strokeStyle='#5a2a36';
  for(const s of segs){
    const f=Math.min(Math.max((p-s.a)/(s.b-s.a),0),1);if(f<=0)continue;
    g.lineWidth=s.w;g.beginPath();g.moveTo(s.x,s.y);g.lineTo(s.x+(s.x2-s.x)*f,s.y+(s.y2-s.y)*f);g.stroke();
  }
  // blossoms
  for(const h of hearts){
    let f=(p-h.t)/.07;if(f<=0)continue;f=Math.min(f,1);
    const sc=f<1?1-Math.pow(1-f,3):1,sw=p>=1?Math.sin(t*.002+h.ph)*1.6:0,sz=h.s*sc;
    g.save();g.translate(h.x+sw,h.y);g.rotate(h.r+sw*.02);g.drawImage(spr[h.c],-sz/2,-sz/2,sz,sz);g.restore();
  }
  // falling hearts
  if(p>=1&&t-lastSpawn>240&&fall.length<40){
    lastSpawn=t;const h=hearts[Math.floor(Math.random()*hearts.length)];
    fall.push({x:h.x,y:h.y,vy:.4+Math.random()*.7,r:h.r,vr:(Math.random()-.5)*.05,s:h.s*.7,c:h.c,ph:Math.random()*T});
  }
  for(let i=fall.length-1;i>=0;i--){
    const f=fall[i];f.y+=f.vy;f.r+=f.vr;
    if(f.y>H+30){fall.splice(i,1);continue}
    g.save();g.translate(f.x+Math.sin(t*.0015+f.ph)*18,f.y);g.rotate(f.r);g.globalAlpha=.9;g.drawImage(spr[f.c],-f.s/2,-f.s/2,f.s,f.s);g.restore();
  }
}

/* ---------- main loop ---------- */
function tick(t){
  if(scene===1){
    g1.clearRect(0,0,W,H);
    const nock=pull||{x:bow.x+2,y:bow.y};
    drawBow(nock);
    if(state==='aim'){
      const a=pull?Math.atan2(bow.y-pull.y,bow.x-pull.x):Math.atan2(target.y-bow.y,target.x-bow.x);
      drawArrow(nock.x,nock.y,a);
      if(pull){g1.strokeStyle='rgba(122,23,69,.5)';g1.lineWidth=1.2;g1.beginPath();g1.arc(pull.x,pull.y,6,0,T);g1.stroke()}
    }else if(arrow){
      if(state==='fly'){
        arrow.x+=arrow.vx;arrow.y+=arrow.vy;arrow.vy+=.025;arrow.a=Math.atan2(arrow.vy,arrow.vx);
        const tx=arrow.x+Math.cos(arrow.a)*66,ty=arrow.y+Math.sin(arrow.a)*66;
        if(Math.hypot(tx-target.x,ty-target.y)<target.r+6)hit();
        else if(arrow.x>W+120||arrow.x<-120||arrow.y<-120||arrow.y>H+120){
          arrow=null;state='aim';misses++;
          const h=$('#hint');h.textContent=misses>1?'almost there. once more':'missed. pull back and try again';h.style.opacity=.8;
        }
      }
      if(arrow)drawArrow(arrow.x,arrow.y,arrow.a);
    }
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l-=.02;
      if(p.l<=0){parts.splice(i,1);continue}
      g1.globalAlpha=p.l;g1.fillStyle=p.c;g1.beginPath();g1.arc(p.x,p.y,p.r,0,T);g1.fill();
    }
    g1.globalAlpha=1;
  }else if(scene===3)drawTree(t);
  requestAnimationFrame(tick);
}
$('#again').addEventListener('click',resetAll);
addEventListener('resize',layout);
layout();requestAnimationFrame(tick);
</script>
</body>
</html>
